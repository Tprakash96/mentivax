services:
  postgres:
    image: postgres:16-alpine
    container_name: mentivax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mentivax
      POSTGRES_PASSWORD: mentivax
      POSTGRES_DB: mentivax
    ports:
      - '5432:5432'
    volumes:
      - mentivax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mentivax']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mentivax_pgdata:
